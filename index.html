<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json?v=52">
<title>ReeganCalc V5.2 DARK + 8 Converters</title>
<style>
:root{ --bg:#0a0a0f; --card:#1a1a2e; --card2:#0f0f1a; --text:#ffffff; --muted:#ffffff99; --border:#ffffff15; --num-bg:#ffffff12; --func-bg:#ffffff08; }
[data-theme="light"]{ --bg:#f5f5f7; --card:#ffffff; --card2:#f0f0f5; --text:#0a0a0f; --muted:#00000066; --border:#00000012; --num-bg:#f0f0f5; --func-bg:#e8e8ef; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui;display:flex;justify-content:center;min-height:100vh;padding:10px;transition:0.3s}
.app{width:100%;max-width:420px;background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:24px;padding:16px;box-shadow:0 20px 60px rgba(124,58,237,0.25);border:1px solid var(--border);margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;font-size:19px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.right{display:flex;gap:8px;align-items:center}
.badge{background:#22c55e22;color:#22c55e;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800;border:1px solid #22c55e44}
.theme-btn{width:40px;height:40px;border-radius:50%;border:2px solid #7c3aed;background:var(--func-bg);font-size:20px;cursor:pointer}
.screen{background:#00000099;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--border);min-height:95px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
[data-theme="light"] .screen{background:#0000000d}
.expr{color:var(--muted);font-size:16px;min-height:20px;word-break:break-all;text-align:right;width:100%}
.result{font-size:38px;font-weight:900;color:var(--text);text-align:right;width:100%;word-break:break-all}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab{padding:9px 14px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer;border:none}
.tab.active{background:#7c3aed;color:white}
.tab.inactive{background:var(--func-bg);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:62px;border-radius:16px;border:none;font-size:20px;font-weight:800;cursor:pointer}
.btn:active{transform:scale(0.93)}
.num{background:var(--num-bg);color:var(--text)}
.op{background:linear-gradient(135deg,#7c3aed,#a855f7);color:white}
.eq{background:linear-gradient(135deg,#f59e0b,#f97316);color:white;font-size:28px}
.func{background:var(--func-bg);color:#a78bfa;font-size:15px}
.conv-box{background:var(--func-bg);border-radius:16px;padding:14px;border:1px solid var(--border)}
.conv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.conv-card{background:var(--card);padding:12px;border-radius:12px;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:13px;font-weight:800}
.conv-card.active{border-color:#7c3aed;background:#7c3aed22;color:#a78bfa}
input{width:100%;padding:14px;border-radius:12px;background:var(--card2);color:var(--text);border:1px solid var(--border);font-size:18px;margin-top:10px}
.footer{margin-top:12px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">REEGANCALC V5.2</div><div class="right"><div class="badge">● V5.2 DARK</div><button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button></div></div>
<div class="screen"><div class="expr" id="expr"></div><div class="result" id="res">0</div></div>
<div class="tabs">
<button class="tab active" id="t-basic" onclick="setMode('basic')">BASIC</button>
<button class="tab inactive" id="t-sci" onclick="setMode('sci')">SCI</button>
<button class="tab inactive" id="t-conv" onclick="setMode('conv')">8 CONVERTERS</button>
</div>
<div id="basic" class="grid basic show">
<button class="btn func" onclick="clr()">AC</button><button class="btn func" onclick="del()">⌫</button><button class="btn func" onclick="add('%')">%</button><button class="btn op" onclick="add('/')">÷</button>
<button class="btn num" onclick="add('7')">7</button><button class="btn num" onclick="add('8')">8</button><button class="btn num" onclick="add('9')">9</button><button class="btn op" onclick="add('*')">×</button>
<button class="btn num" onclick="add('4')">4</button><button class="btn num" onclick="add('5')">5</button><button class="btn num" onclick="add('6')">6</button><button class="btn op" onclick="add('-')">−</button>
<button class="btn num" onclick="add('1')">1</button><button class="btn num" onclick="add('2')">2</button><button class="btn num" onclick="add('3')">3</button><button class="btn op" onclick="add('+')">+</button>
<button class="btn num" onclick="add('00')">00</button><button class="btn num" onclick="add('0')">0</button><button class="btn num" onclick="add('.')">.</button><button class="btn eq" onclick="calc()">=</button>
</div>
<div id="sci" class="grid sci" style="display:none">
<button class="btn func" onclick="add('Math.sin(')">sin</button><button class="btn func" onclick="add('Math.cos(')">cos</button><button class="btn func" onclick="add('Math.tan(')">tan</button><button class="btn func" onclick="add('Math.log10(')">log</button>
<button class="btn func" onclick="add('Math.sqrt(')">√</button><button class="btn func" onclick="add('**2')">x²</button><button class="btn func" onclick="add('**')">xʸ</button><button class="btn func" onclick="add('Math.PI')">π</button>
<button class="btn func" onclick="add('(')">(</button><button class="btn func" onclick="add(')')">)</button><button class="btn func" onclick="add('Math.E')">e</button><button class="btn func" onclick="clr()">AC</button>
<button class="btn num" onclick="add('7')">7</button><button class="btn num" onclick="add('8')">8</button><button class="btn num" onclick="add('9')">9</button><button class="btn op" onclick="add('/')">÷</button>
<button class="btn num" onclick="add('4')">4</button><button class="btn num" onclick="add('5')">5</button><button class="btn num" onclick="add('6')">6</button><button class="btn op" onclick="add('*')">×</button>
<button class="btn num" onclick="add('1')">1</button><button class="btn num" onclick="add('2')">2</button><button class="btn num" onclick="add('3')">3</button><button class="btn op" onclick="add('-')">−</button>
<button class="btn num" onclick="add('0')">0</button><button class="btn num" onclick="add('.')">.</button><button class="btn func" onclick="del()">⌫</button><button class="btn eq" onclick="calc()">=</button>
</div>
<div id="conv" style="display:none"><div class="conv-box"><div class="conv-grid" id="convGrid"></div><input id="cinput" type="number" placeholder="Enter value" oninput="doConvert()"><div id="coutput" style="margin-top:14px;font-size:14px;font-weight:700;line-height:1.7"></div></div></div>
<div class="footer">V5.2 • DARK/LIGHT 🌙☀️ • 8 CONVERTERS • 100% OFFLINE • KENYA 🇰🇪</div>
</div>
<script>
let exp=""; let currentConv="length";
const converters={
 length:{name:"📏 Length", f:v=>`${v} m = ${(v*3.28084).toFixed(3)} ft = ${(v*0.000621371).toFixed(4)} mi<br>${v} km = ${(v*0.621371).toFixed(3)} mi`},
 weight:{name:"⚖️ Weight", f:v=>`${v} kg = ${(v*2.20462).toFixed(3)} lb = ${(v*1000).toFixed(0)} g`},
 temp:{name:"🌡️ Temp", f:v=>`${v}°C = ${(v*9/5+32).toFixed(2)}°F = ${(v+273.15).toFixed(2)}K`},
 currency:{name:"💰 KES↔USD", f:v=>`${v} KES = ${(v/130).toFixed(2)} USD | ${v} USD = ${(v*130).toFixed(0)} KES`},
 area:{name:"📐 Area", f:v=>`${v} m² = ${(v*10.7639).toFixed(2)} ft² | ${v} acre = ${(v*4046.86).toFixed(1)} m²`},
 volume:{name:"🧪 Volume", f:v=>`${v} L = ${(v*0.264172).toFixed(3)} gal = ${(v*1000).toFixed(0)} ml`},
 time:{name:"⏱️ Time", f:v=>`${v} hr = ${(v*60).toFixed(0)} min = ${(v*3600).toFixed(0)} sec`},
 speed:{name:"🚗 Speed", f:v=>`${v} km/h = ${(v*0.621371).toFixed(2)} mph = ${(v*0.277778).toFixed(2)} m/s`}
};
function setMode(m){
 document.getElementById('basic').style.display=m=='basic'?'grid':'none';
 document.getElementById('sci').style.display=m=='sci'?'grid':'none';
 document.getElementById('conv').style.display=m=='conv'?'block':'none';
 document.getElementById('t-basic').className=m=='basic'?'tab active':'tab inactive';
 document.getElementById('t-sci').className=m=='sci'?'tab active':'tab inactive';
 document.getElementById('t-conv').className=m=='conv'?'tab active':'tab inactive';
 if(m=='conv') renderConv();
}
function add(v){if(exp.length>80)return;exp+=v;document.getElementById('expr').innerText=exp.replaceAll('*','×').replaceAll('/','÷');}
function clr(){exp="";document.getElementById('expr').innerText="";document.getElementById('res').innerText="0"}
function del(){exp=exp.slice(0,-1);document.getElementById('expr').innerText=exp.replaceAll('*','×').replaceAll('/','÷');if(!exp)document.getElementById('res').innerText="0"}
function calc(){try{if(!exp)return;let r=Function('"use strict";return ('+exp+')')();if(!isFinite(r))throw 0;r=Math.round((r+Number.EPSILON)*1e8)/1e8;document.getElementById('res').innerText=r;exp=r.toString();}catch{ document.getElementById('res').innerText="Error";exp="";}}
function renderConv(){let g=document.getElementById('convGrid'); g.innerHTML=""; Object.keys(converters).forEach(k=>{let d=document.createElement('div'); d.className='conv-card'+(k==currentConv?' active':''); d.innerHTML=converters[k].name; d.onclick=()=>{currentConv=k;renderConv();doConvert();}; g.appendChild(d);}); doConvert();}
function doConvert(){let v=parseFloat(document.getElementById('cinput').value);let out=document.getElementById('coutput'); if(isNaN(v)){out.innerHTML="Enter value above ☝️";return} out.innerHTML=converters[currentConv].f(v);}
function toggleTheme(){
 let cur=document.documentElement.getAttribute('data-theme');
 if(cur=='light'){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','dark');document.getElementById('themeBtn').innerText='🌙';}
 else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('theme','light');document.getElementById('themeBtn').innerText='☀️';}
}
(function(){let t=localStorage.getItem('theme'); if(t=='light'){document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeBtn').innerText='☀️';}})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=52').then(r=>r.update()));}
</script>
</body>
</html>
