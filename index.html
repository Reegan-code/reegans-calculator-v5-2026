<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReeganCalc V5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>ReeganCalc V5 - Offline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto;display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top) 10px 10px 10px}
.app{width:100%;max-width:400px;background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%);border-radius:24px;padding:16px;box-shadow:0 20px 60px rgba(124,58,237,0.3);border:1px solid rgba(255,255,255,0.1);margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;font-size:20px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:#22c55e22;color:#22c55e;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid #22c55e44}
.screen{background:#00000088;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.08);min-height:90px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.expr{color:#ffffff99;font-size:16px;min-height:20px;word-break:break-all;text-align:right;width:100%}
.result{font-size:36px;font-weight:800;color:white;text-align:right;width:100%;word-break:break-all}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab{padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;border:none}
.tab.active{background:#7c3aed;color:white}
.tab.inactive{background:#ffffff15;color:#ffffff99}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:62px;border-radius:16px;border:none;font-size:20px;font-weight:700;cursor:pointer;transition:transform 0.1s;user-select:none}
.btn:active{transform:scale(0.92)}
.num{background:#ffffff12;color:white}
.op{background:linear-gradient(135deg,#7c3aed,#a855f7);color:white}
.eq{background:linear-gradient(135deg,#f59e0b,#f97316);color:white;font-size:26px}
.func{background:#ffffff08;color:#a78bfa;font-size:16px}
.sci{display:none}
.sci.show{display:grid}
.basic.show{display:grid}
.footer{margin-top:12px;text-align:center;font-size:10px;color:#ffffff44}
.offline-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">REEGANCALC V5</div><div class="badge"><span class="offline-dot"></span> OFFLINE READY</div></div>
<div class="screen"><div class="expr" id="expr"></div><div class="result" id="res">0</div></div>
<div class="tabs">
<button class="tab active" id="t-basic" onclick="setMode('basic')">BASIC</button>
<button class="tab inactive" id="t-sci" onclick="setMode('sci')">SCIENTIFIC</button>
<button class="tab inactive" id="t-conv" onclick="setMode('conv')">CONVERTER</button>
</div>
<div id="basic" class="grid basic show">
<button class="btn func" onclick="clr()">AC</button>
<button class="btn func" onclick="del()">⌫</button>
<button class="btn func" onclick="add('%')">%</button>
<button class="btn op" onclick="add('/')">÷</button>
<button class="btn num" onclick="add('7')">7</button>
<button class="btn num" onclick="add('8')">8</button>
<button class="btn num" onclick="add('9')">9</button>
<button class="btn op" onclick="add('*')">×</button>
<button class="btn num" onclick="add('4')">4</button>
<button class="btn num" onclick="add('5')">5</button>
<button class="btn num" onclick="add('6')">6</button>
<button class="btn op" onclick="add('-')">−</button>
<button class="btn num" onclick="add('1')">1</button>
<button class="btn num" onclick="add('2')">2</button>
<button class="btn num" onclick="add('3')">3</button>
<button class="btn op" onclick="add('+')">+</button>
<button class="btn num" onclick="add('00')">00</button>
<button class="btn num" onclick="add('0')">0</button>
<button class="btn num" onclick="add('.')">.</button>
<button class="btn eq" onclick="calc()">=</button>
</div>
<div id="sci" class="grid sci">
<button class="btn func" onclick="add('Math.sin(')">sin</button>
<button class="btn func" onclick="add('Math.cos(')">cos</button>
<button class="btn func" onclick="add('Math.tan(')">tan</button>
<button class="btn func" onclick="add('Math.log10(')">log</button>
<button class="btn func" onclick="add('Math.sqrt(')">√</button>
<button class="btn func" onclick="add('**2')">x²</button>
<button class="btn func" onclick="add('**')">xʸ</button>
<button class="btn func" onclick="add('Math.PI')">π</button>
<button class="btn func" onclick="add('(')">(</button>
<button class="btn func" onclick="add(')')">)</button>
<button class="btn func" onclick="add('Math.E')">e</button>
<button class="btn func" onclick="clr()">AC</button>
<button class="btn num" onclick="add('7')">7</button>
<button class="btn num" onclick="add('8')">8</button>
<button class="btn num" onclick="add('9')">9</button>
<button class="btn op" onclick="add('/')">÷</button>
<button class="btn num" onclick="add('4')">4</button>
<button class="btn num" onclick="add('5')">5</button>
<button class="btn num" onclick="add('6')">6</button>
<button class="btn op" onclick="add('*')">×</button>
<button class="btn num" onclick="add('1')">1</button>
<button class="btn num" onclick="add('2')">2</button>
<button class="btn num" onclick="add('3')">3</button>
<button class="btn op" onclick="add('-')">−</button>
<button class="btn num" onclick="add('0')">0</button>
<button class="btn num" onclick="add('.')">.</button>
<button class="btn func" onclick="del()">⌫</button>
<button class="btn eq" onclick="calc()">=</button>
</div>
<div id="conv" style="display:none;background:#ffffff08;border-radius:16px;padding:14px">
<select id="ctype" onchange="convert()" style="width:100%;padding:10px;border-radius:10px;background:#1a1a2e;color:white;border:1px solid #ffffff22;margin-bottom:10px">
<option value="length">Length (m ↔ ft)</option>
<option value="weight">Weight (kg ↔ lb)</option>
<option value="temp">Temperature (°C ↔ °F)</option>
<option value="currency">Currency (KES ↔ USD ~130)</option>
</select>
<input id="cinput" type="number" placeholder="Enter value" oninput="convert()" style="width:100%;padding:12px;border-radius:10px;background:#00000066;color:white;border:1px solid #ffffff22;font-size:18px">
<div id="coutput" style="margin-top:10px;font-size:18px;font-weight:700;color:#a78bfa"></div>
</div>
<div class="footer">REEGAN'S PROJECT • KENYA • 100% OFFLINE • NO ADS • STANDALONE APP</div>
</div>
<script>
let exp="";
function setMode(m){
document.getElementById('basic').style.display=m=='basic'?'grid':'none';
document.getElementById('basic').className='grid basic '+(m=='basic'?'show':'');
document.getElementById('sci').style.display=m=='sci'?'grid':'none';
document.getElementById('sci').className='grid sci '+(m=='sci'?'show':'');
document.getElementById('conv').style.display=m=='conv'?'block':'none';
document.getElementById('t-basic').className=m=='basic'?'tab active':'tab inactive';
document.getElementById('t-sci').className=m=='sci'?'tab active':'tab inactive';
document.getElementById('t-conv').className=m=='conv'?'tab active':'tab inactive';
}
function add(v){if(exp.length>80)return;exp+=v;document.getElementById('expr').innerText=exp.replaceAll('*','×').replaceAll('/','÷');}
function clr(){exp="";document.getElementById('expr').innerText="";document.getElementById('res').innerText="0"}
function del(){exp=exp.slice(0,-1);document.getElementById('expr').innerText=exp.replaceAll('*','×').replaceAll('/','÷');if(!exp)document.getElementById('res').innerText="0"}
function calc(){try{if(!exp)return;let e=exp.replaceAll('÷','/').replaceAll('×','*');let r=Function('"use strict";return ('+e+')')();if(!isFinite(r))throw "err";r=Math.round((r+Number.EPSILON)*100000000)/100000000;document.getElementById('res').innerText=r;exp=r.toString();}catch(err){document.getElementById('res').innerText="Error";exp="";}}
function convert(){let v=parseFloat(document.getElementById('cinput').value);let t=document.getElementById('ctype').value;let out=document.getElementById('coutput');if(isNaN(v)){out.innerText="";return}let res="";if(t=='length')res=`${v} m = ${(v*3.28084).toFixed(3)} ft | ${v} ft = ${(v/3.28084).toFixed(3)} m`;if(t=='weight')res=`${v} kg = ${(v*2.20462).toFixed(3)} lb | ${v} lb = ${(v/2.20462).toFixed(3)} kg`;if(t=='temp')res=`${v}°C = ${(v*9/5+32).toFixed(2)}°F | ${v}°F = ${((v-32)*5/9).toFixed(2)}°C`;if(t=='currency')res=`${v} KES = ${(v/130).toFixed(2)} USD | ${v} USD = ${(v*130).toFixed(0)} KES`;out.innerText=res;}

// PWA OFFLINE + STANDALONE FIX
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(()=>{});
  });
}
window.onerror=function(){return true}
</script>
</body>
</html>
